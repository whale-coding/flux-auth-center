server:
  port: 8080
  # 优雅停机：等正在处理的请求跑完再关
  shutdown: graceful

spring:
  application:
    name: flux-auth-center
  profiles:
    # 生产用 --spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# ==================== mybatis-plus ====================
mybatis-plus:
  # mapper xml 位置，约定放在各模块 resources/mapper 下
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射到实体驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 所有业务表的主键都是 auto_increment
      id-type: auto
      # 逻辑删除由 BaseEntity.deleted 上的 @TableLogic 控制，这里不再重复配置

# ==================== 跨域（CorsProperties） ====================
cors:
  enabled: true
  allowed-origin-patterns:
    - "*"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - "*"
  # 允许携带 cookie 时，allowed-origin-patterns 不能用 "*"（用具体域名或正则）
  allow-credentials: true
  max-age: 3600

# ==================== sa-token ====================
sa-token:
  token-name: Authorization
  # token 有效期 30 天
  timeout: 2592000
  # 活跃超时，-1 表示不单独限制
  active-timeout: -1
  # 允许同一账号多端登录
  is-concurrent: true
  # 多端登录时共用一个 token
  is-share: false
  token-style: uuid
  # 纯前后端分离，不读写 cookie
  is-read-cookie: false
  is-log: false

# ==================== 接口文档 ====================
doc:
  enable: true
  title: Flux 认证中心接口文档
  description: 登录、登出、当前登录人
  version: 1.0.0
  # 和 sa-token 的 token-name 保持一致
  auth-header: Authorization

# 文档由 springdoc 生成，供 Apifox 等外部工具导入；本工程不再内置 Swagger UI / Knife4j 页面
springdoc:
  api-docs:
    path: /v3/api-docs
    # 输出 OpenAPI 3.0，兼容性最好（默认是 3.1）
    version: openapi_3_0

# ==================== 日志 ====================
logging:
  level:
    root: info
    com.flux: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
